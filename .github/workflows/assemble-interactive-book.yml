name: assemble-interactive-book
on:
  push:
    branches: [ejercicios-interactivos-2026]
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact index.html
        run: |
          cat .tmp/gzpart1.txt .tmp/gzpart2.txt .tmp/gzpart3.txt .tmp/gzpart4.txt .tmp/gzpart5.txt .tmp/gzpart6.txt .tmp/gzpart7.txt .tmp/gzpart8.txt .tmp/gzpart9.txt > /tmp/index.gz.b64
          base64 -d /tmp/index.gz.b64 | gzip -d > index.html
          rm -rf .tmp .github/workflows/assemble-interactive-book.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add interactive exercises by chapter"
          git push
